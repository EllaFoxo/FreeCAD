_inherits:
  - FreeCAD Base.yaml

# ── Color palette ─────────────────────────────────────────────────────────────
# Re-anchor both scales: Neutral.000–900 spans dark-to-light from a dark base;
# Contrast.900 (= BaseTextColor) becomes near-white from a light base.
BaseNeutral: "#343a40"
BaseContrast: "#f1f3f5"

# ── Background semantic remapping ─────────────────────────────────────────────
# Base maps Background.000–200 to Neutral.000–200 (the light end of the scale).
# Dark theme flips this to the dark end so inputs, panels, and hover states
# all sit in the expected dark range.
Background:
  000: "@Neutral.900"
  050: "@Neutral.850"
  100: "@Neutral.800"
  150: "@Neutral.750"
  200: "@Neutral.700"

BaseTextColor: "@Contrast.400"

ButtonBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Neutral.300, @Neutral.400)"

# ── Effect direction ──────────────────────────────────────────────────────────
# On dark surfaces, hover feedback should brighten borders, not darken them.
BaseHoveredBorderColorEffect: "effect(lighten: 0.08)"

SketcherConflictingConstraintsColor: "#fc6c6c"
SketcherEmptySketchColor: "#ffffff"
SketcherFullyConstrainedColor: "#8cff5b"
SketcherMalformedConstraintsColor: "#fc6c6c"
SketcherPartiallyRedundantConstraintsColor: "#77cbff"
SketcherRedundantConstraintsColor: "#ffa256"
SketcherSolverFailedColor: "#ff9090"
SketcherUnderConstrainedColor: "#ffffff"
