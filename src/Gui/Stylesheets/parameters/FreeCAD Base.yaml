---
# "@Name" inside an expression is a flat parameter lookup: it finds a parameter literally
# named "Name" or nothing at all. It is NOT a component-chain lookup. FreeCADStyle walks
# Button → FormControl when a widget asks for a Height, but that walk happens at draw time
# and the expression evaluator has no part in it — so "@ButtonHeight" here resolves to the
# literal string "@ButtonHeight", which is an engaged value that stops the chain walk dead
# and silently disables the property. Always reference the concrete parameter that exists
# (here: "@FormControlHeight").

# ── Semantic surface tokens (drive QPalette) ─────────────────────────────────
# Window / panel backgrounds
BaseWindowBackground: "@Background.050"
BaseAlternateBackground: "@Background.100"
BaseInputBackground: "@Background.000"

# Selection
BaseHighlightBackground: "@Accent.500"
BaseHighlightTextColor: "@Neutral.000"

# Disabled
BaseDisabledTextColor: "@Contrast.300"
BaseDisabledBackground: "@Neutral.200"

# Placeholder text in inputs
BasePlaceholderTextColor: "@Contrast.400"

# Links / URLs
BaseLinkColor: "@Accent.600"

# Tooltips
BaseTooltipBackground: "@Background.100"
BaseTooltipTextColor: "@BaseTextColor"

# 3D shading (QPalette Light / Midlight / Mid / Dark / Shadow)
BaseShadingLight: "@Neutral.100"
BaseShadingMidlight: "@Neutral.200"
BaseShadingMid: "@Neutral.400"
BaseShadingDark: "@Neutral.600"
BaseShadingShadow: "@Neutral.800"

BaseBorderColor: "@Neutral.400"
BaseShadowColor: "opacity(@Colors.black, 8%)"
BaseHoveredBorderColorEffect: "effect(darken: 0.08)"

FormControlInternalHeight: 22px
FormControlSmallHeight: 24px
FormControlHeight: 26px
FormControlBigHeight: 30px

FormControlInternalFontSize: 6px

FormControlIconSpacing: "@Spacing.150"

FormControlPadding: "padding(horizontal: @Spacing.100, vertical: @Spacing.075)"
FormControlBorderThickness: 1px
FormControlBorderRadius: "@BaseRadius.medium"
FormControlBorderColor: "@BaseBorderColor"
FormControlTextColor: "@BaseTextColor"

ButtonBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Background.100, @Background.200)"
ButtonMinWidth: 100px
ButtonPadding: "padding(horizontal: @Spacing.300, vertical: @Spacing.100)"

ButtonInternalPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.050)"

ButtonIconSpacing: "@FormControlIconSpacing"
ButtonIconSize: 16px
ButtonFontSize: 12px
ButtonFontWeight: 500
ButtonContentBox: "content_box((width: @ButtonMinWidth, height: @FormControlHeight), @ButtonPadding, @FormControlBorderThickness)"

ButtonSmallFontSize: 11px
ButtonSmallFontWeight: 500

ButtonFocusedBorderColor: "@Accent.600"
ButtonPrimaryFocusedBorderColor: "@ButtonFocusedBorderColor"

ButtonSpacing: "@Spacing.250"

ButtonTextColor: "@BaseTextColor"
ButtonBorderColor: "@BaseBorderColor"

ButtonHoveredBackgroundEffect: "effect(lighten: 0.035)"
ButtonPressedBackgroundEffect: "effect(darken: 0.04)"
ButtonCheckedBackgroundEffect: "effect(darken: 0.03)"

ButtonPressedInnerShadow: "inner_shadow(color: rgba(0, 0, 0, 50), y: 2px, blur: 6px)"

ButtonCheckedInnerShadow: "@ButtonPressedInnerShadow"

ButtonDisabledBackground: "@BaseDisabledBackground"
ButtonDisabledTextColor: "@BaseDisabledTextColor"
ButtonDisabledBorderColor: "@BaseBorderColor"

ButtonPrimaryBackground: "blend(@ButtonBackground, @Accent.500, 15%)"
ButtonPrimaryBorderColor: "blend(@ButtonBorderColor, @Accent.500, 25%)"

ButtonLinkBackground: "@Colors.transparent"
ButtonLinkBorderColor: "@Colors.transparent"

ButtonLinkHoveredBackground: "@Background.100"
ButtonLinkHoveredBorderColor: "@BaseBorderColor"

ButtonLinkPressedBackground: "@Background.200"
ButtonLinkPressedBorderColor: "@BaseBorderColor"
ButtonLinkPressedInnerShadow: "@ButtonPressedInnerShadow"

ButtonLinkCheckedBackground: "@Background.150"
ButtonLinkCheckedBorderColor: "@BaseBorderColor"
ButtonLinkCheckedInnerShadow: "@ButtonCheckedInnerShadow"

ToolButtonPadding: "padding(@Spacing.150)"
ToolButtonSmallPadding: "padding(@Spacing.100)"
ToolButtonInternalPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.050)"

# A tool button is at least as wide as it is tall, so an icon-only one is never narrower than
# square. The floors are the form-control heights, which is what a tool button's own Height
# resolves to through Button → FormControl. Toolbar buttons take these floors too — see the
# note under the Link variant below for what that costs at small icon sizes.
ToolButtonMinWidth: "@FormControlHeight"
ToolButtonSmallMinWidth: "@FormControlSmallHeight"
ToolButtonInternalMinWidth: "reset()"

# ── PanelButton (dock panel title bar) ────────────────────────────────────────
# A component override set on OverlayToolButton, so it resolves ahead of the
# ToolButton chain. The title bar is a thin strip and its buttons are secondary
# to the panel content, so they carry a smaller icon than a tool button elsewhere.

PanelButtonIconSize: 12px

# ── ToolButton – Link variant (auto-raise / toolbar buttons) ──────────────────
# These tokens define the visual appearance of QToolButton with autoRaise=true,
# which covers all standard toolbar buttons. The padding is uniform, so an icon-only
# button grows squarely: size = iconSize + 2 * padding.
#
# That square only survives while iconSize + 2 * padding clears ToolButtonMinWidth (26px),
# i.e. from an 18px icon upward. FreeCAD's default toolbar icon size is 24px, which measures
# 32x32 and is unaffected. Below 18px the width floor wins and the button reads slightly wide:
# a 16px icon measures 26x24 rather than 24x24. Height is never floored — ToolBarButtonHeight
# is reset — so the two axes part company there rather than the button growing in both.

ToolButtonLinkPadding: "@Spacing.100"
ToolButtonMenuWidth: 14px

# ── Internal Button ───────────────────────────────────────────────────────────
# Flat action button used inside custom composite widgets (e.g. the geometry
# selector's change / remove controls). FreeCADStyle paints it directly on the child
# widget so it looks the same under any application QStyle. Deliberately simplified:
# transparent at rest, a solid fill only while hovered or pressed, no gradient and no
# border. Because it inherits FormControl rather than Button it has none of Button's
# hover/pressed effects — the fill comes solely from the explicit state backgrounds
# below. Height and min-width are reset so its compact padding drives the size.
InternalButtonBackground: "@Colors.transparent"
InternalButtonBorderColor: "@Colors.transparent"
InternalButtonBorderThickness: 0px
InternalButtonBorderRadius: "@BaseRadius.medium"
InternalButtonPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.050)"
InternalButtonHeight: "reset()"
InternalButtonMinWidth: "reset()"

InternalButtonHoveredBackground: "@Background.150"
InternalButtonPressedBackground: "@Background.200"

ToolBarItemSpacing: "@Spacing.075"
ToolBarItemMargin: "@Spacing.050"

ToolBarButtonHeight: "reset()" # Do not enforce height for toolbar buttons

ToolBarBackground: "@Background.100"
ToolBarBorderColor: "@BaseBorderColor"
ToolBarBorderThickness: "border_thickness(0px, bottom: 1px)" # Canonical North: bottom edge; rotated for other positions

# ── SplitButton ───────────────────────────────────────────────────────────────
# Each half of Gui::SplitButton sets component="SplitButtonMain" / "SplitButtonMenu"
# so the token system can zero the inner corners and remove the shared border without
# FreeCADStyle needing to know about SplitButton.
SplitButtonMainBorderRadius: "border_radius(@FormControlBorderRadius, right: 0px)"
SplitButtonMenuBorderRadius: "border_radius(@FormControlBorderRadius, left: 0px)"
SplitButtonMenuBorderThickness: "border_thickness(@FormControlBorderThickness, left: 0px)"

# Transparent variant — toolbars in status bar and menu bar corner (no background, no border)
ToolBarTransparentBackground: "reset()"
ToolBarTransparentBorderColor: "reset()"

# WbToolBar — the toolbar hosting the workbench selector sits flush with no layout margins so the
# tabs span its full extent. QToolBarLayout rebuilds its contents margins from ToolBarItemMargin +
# ToolBarFrameWidth on every invalidate, so both must resolve to zero here.
WbToolBarItemMargin: 0px
WbToolBarFrameWidth: 0px

# ── Select Padding overrides
# A select is roomier than a plain form control at the default size, but at the small and big
# sizes it drops back to the form-control padding. There is no size-specific FormControl padding
# to name, so both point at the single one that exists.
SelectPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.100)"
SelectSmallPadding: "@FormControlPadding"
SelectBigPadding: "@FormControlPadding"

# ── Line Edit / Input fields ──────────────────────────────────────────────
LineEditBackground: "@Background.000"
LineEditBorderColor: "@FormControlBorderColor"
LineEditBorderRadius: "@FormControlBorderRadius"
LineEditBorderThickness: "@FormControlBorderThickness"
LineEditPadding: "@FormControlPadding"
LineEditHeight: "@FormControlHeight"
LineEditSmallHeight: "@FormControlSmallHeight"

LineEditFocusedBorderColor: "@Accent.500"
LineEditHoveredBorderColorEffect: "@BaseHoveredBorderColorEffect"

LineEditDisabledBackground: "@BaseDisabledBackground"
LineEditDisabledTextColor: "@BaseDisabledTextColor"

# ── ComboBox / Editable combo fields ─────────────────────────────────────
# Editable QComboBox uses the chain: ComboBox → LineEdit → FormControl.
# Add ComboBox* overrides here when the editable combo needs to differ from LineEdit.

InputBackground: "@Background.000"

TextEditPadding: "padding(@FormControlPadding.left)"

DialogBackground: "@Background.050"

# Read by resolveBoxStyle as the box's own fill. It named the opaque patch behind the title
# while QSS drew the group box; the title is masked out of the border now, so nothing is
# painted behind it and the body stays see-through.
GroupBoxBackground: "@Colors.transparent"
GroupBoxBorderColor: "@Neutral.300"
GroupBoxBorderRadius: "@BaseRadius.medium"
GroupBoxBorderThickness: 1px
GroupBoxPadding: "padding(@Spacing.300)"

# Flat group boxes keep Qt's convention — a single line along the top edge, no side or bottom
# frame. Override these three to give a flat box a frame of its own.
GroupBoxFlatBorderThickness: "border_thickness(0px, top: 1px)"
GroupBoxFlatBorderRadius: 0px
# With no side or bottom line to stand off from, only the gap below the top line means anything.
GroupBoxFlatPadding: "padding(0, top: @Spacing.300)"

GroupBoxTitlePadding: "padding(horizontal: @Spacing.150, vertical: 0)"
GroupBoxTitleFontWeight: 600
GroupBoxTitleTextColor: "@Contrast.500"

SeparatorThickness: 1px
SeparatorColor: "@BaseBorderColor"

CheckBoxWidth: 14px
CheckBoxHeight: "@CheckBoxWidth"
CheckBoxSpacing: "@Spacing.150"

CheckBoxSmallWidth: 12px
CheckBoxSmallHeight: "@CheckBoxSmallWidth"

# Indicator box appearance
CheckBoxBackground: "@Background.000"
CheckBoxBorderRadius: "@BaseRadius.medium"
CheckBoxPadding: "padding(@Spacing.100)"
CheckBoxTickColor: "@BaseTextColor"


# State overrides
CheckBoxFocusedBorderColor: "@Accent.500"
CheckBoxHoveredBorderColorEffect: "@BaseHoveredBorderColorEffect"

CheckBoxDisabledBackground: "@BaseDisabledBackground"
CheckBoxDisabledTickColor: "@BaseDisabledTextColor"

CheckBoxPressedInnerShadow: "inner_shadow(color: rgba(0, 0, 0, 50), y: 1px, blur: 4px)"

# ── Radio Button indicator ────────────────────────────────────────────────
# Inherits all visual properties from CheckBox; only border radius is overridden
# to produce a circular indicator.
RadioButtonBorderRadius: "border_radius(50%)"

# ── Scroll Bar ───────────────────────────────────────────────────────────
ScrollBarBackground: "@Colors.transparent"
ScrollBarHoveredBackground: "opacity(@BaseBorderColor, 0.1)"

ScrollBarThumbBackground: "@Neutral.400"
ScrollBarThumbHoveredBackground: "@Neutral.600"
ScrollBarThumbBorderRadius: "@BaseRadius.medium"
ScrollBarThumbMargin: "padding(@Spacing.100)"
ScrollBarThumbMinLength: 50px

# ── List / Tree / Table Frame ───────────────────────────────────────────────
ListBackground: "@Background.000"
ListBorderColor: "@FormControlBorderColor"
ListBorderRadius: "@FormControlBorderRadius"
ListBorderThickness: "@FormControlBorderThickness"

# State overrides — the list frame reacts to focus and hover like a text input,
# so its accent focus ring and hover border effect are derived from LineEdit.
ListFocusedBorderColor: "@LineEditFocusedBorderColor"
ListHoveredBorderColorEffect: "@LineEditHoveredBorderColorEffect"

ListDisabledBackground: "@LineEditDisabledBackground"
ListDisabledTextColor: "@LineEditDisabledTextColor"

# ── GeometrySelector ─────────────────────────────────────────────────────────
# Composite selection field (Gui::GeometrySelectorWidget) rendered as a list but
# sized like a form control, so it never stands shorter than the line edits and
# spin boxes beside it in a task form.
GeometrySelectorMinHeight: "@FormControlHeight"
GeometrySelectorPadding: "padding(@Spacing.050)"
GeometrySelectorItemSpacing: "@Spacing.050"
GeometrySelectorItemPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.050)"

# ── List Item ──────────────────────────────────────────────────────────────
ListItemPadding: "padding(horizontal: @Spacing.100, vertical: @Spacing.050)"
ListItemIconSpacing: "@Spacing.150"

# ── List Row ───────────────────────────────────────────────────────────────
# Default rows are transparent; alternate rows use the QPalette AlternateBase
# color. The Alternate variant prefix (ListRowAlternate*) is tried before the
# plain ListRow* fallback when QStyleOptionViewItem::Alternate is set.
ListRowAlternateBackground: "@BaseAlternateBackground"


# ── Item state backgrounds (hover / selection) ────────────────────────────
# State_Selected maps to Selected in the token system (same as an active tab).
# State_Sunken (pressed) and State_MouseOver (hovered) map directly.
# No explicit token = transparent (falls through to row background).
ListRowSelectedBackground: "opacity(@Accent.500, 40%)"
ListItemSelectedTextColor: "@BaseTextColor"

ListRowHoveredBackground: "opacity(@Accent.500, 20%)"
ListRowPressedBackground: "@Background.200"

# ── Dropdown List (QComboBox popup) ────────────────────────────────────────
# A combo box names its own dropdown component through the "dropdownComponent" property, so a
# popup that must not be capped clears the height here rather than in shared code.
DropdownListMaxHeight: "250px"
WorkbenchSelectorDropdownMaxHeight: "reset()"

# Where a dropdown sits relative to its combo box.
#   current — the selected row lands on the combo box (menu-style)
#   below   — the popup's top edge meets the combo box's bottom edge
# An unrecognised value falls back to current. The screen-edge clamp outranks both: a long popup
# near the bottom of the screen stays on screen rather than staying aligned.
DropdownListPlacement: "current"
# Applied after placement, in either mode. Positive moves the popup down.
DropdownListPlacementOffset: 0px

# A dropdown is meant to look like a menu, so it aliases the Menu tokens rather than repeating
# their values — retuning a menu retunes every dropdown with it. It is a different painting path
# though (SH_ComboBox_Popup is declined, so the popup is an ordinary item view), and the two
# paths divide the work differently: an item view keeps its interaction fills on the Row element
# and its padding and label colour on Item, where a menu puts everything on the item. The names
# below follow the item-view path; aliasing the Menu names verbatim would define tokens nothing
# ever resolves.
#
# The surface: the container around the list is a QFrame, and its frame is the popup's edge.
DropdownListBackground: "@MenuBackground"
DropdownListBorderColor: "@MenuBorderColor"
DropdownListBorderThickness: "@MenuBorderThickness"
DropdownListBorderRadius: "@MenuBorderRadius"
DropdownListPadding: "@MenuPadding"

# The rows. No DropdownListItemTextColor or DropdownListItemDisabledTextColor: the item-view path
# only overrides the label colour of the highlighted row, and a resting or disabled dropdown label
# already takes the same palette colour a menu's does.
DropdownListItemPadding: "@MenuItemPadding"
DropdownListItemIconSpacing: "@MenuItemIconSpacing"
DropdownListItemSpacing: "@MenuItemSpacing"

# The highlight. Moving the pointer over a dropdown row makes it the current row, so hover and
# selection are the same thing here and share the menu's one highlight.
DropdownListRowBorderRadius: "@MenuItemBorderRadius"
DropdownListRowHoveredBackground: "@MenuItemHoveredBackground"
DropdownListRowSelectedBackground: "@ListRowSelectedBackground"
DropdownListRowPressedBackground: "@MenuItemPressedBackground"

# ── Tree Item ──────────────────────────────────────────────────────────────
TreeItemPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.100)"

# Connector lines in the indent column. Kept faint on purpose — they mark hierarchy without
# competing with the items. Any component can cancel them with reset(), and any widget with
# setProperty("branches", false).
TreeBranchBorderColor: "@BaseBorderColor"
TreeBranchBorderThickness: 1px

# The document tree paints each item as a free-standing box only over a transparent surface,
# where a full-width row would put an opaque stripe across the 3D view. Docked, none of these
# tokens resolve and the tree falls back through Tree → List to the ordinary item-view look.
DocumentTreeRowTransparentBackground: "reset()"

DocumentTreeItemTransparentBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Background.050, @Background.100)"
DocumentTreeItemTransparentBorderRadius: "@BaseRadius.medium"
DocumentTreeItemTransparentBorderThickness: 1px
DocumentTreeItemTransparentBorderColor: "@BaseBorderColor"

DocumentTreeItemTransparentPadding: "padding(horizontal: @Spacing.200, vertical: 3px)"
DocumentTreeItemTransparentSpacing: "@Spacing.100"

DocumentTreeItemTransparentHoveredBackgroundEffect: "effect(lighten: 0.05)"

DocumentTreeItemTransparentSelectedBackground: "blend(@DocumentTreeItemTransparentBackground, @Accent.500, 20%)"
DocumentTreeItemTransparentSelectedBorderColor: "blend(@DocumentTreeItemTransparentBorderColor, @Accent.500, 20%)"

# ── Header / QHeaderView ─────────────────────────────────────────────────────
# Section background — button-like but flat (no border radius)
HeaderItemBackground: "@ButtonBackground"
HeaderItemHoveredBackgroundEffect: "@ButtonHoveredBackgroundEffect"
HeaderItemPressedBackgroundEffect: "@ButtonPressedBackgroundEffect"
HeaderItemPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.100)"
HeaderItemTextColor: "@ButtonTextColor"
HeaderItemDisabledTextColor: "@ButtonDisabledTextColor"

# Border: bottom only (content separator). Side separators are transparent by default
# but can be enabled by overriding these tokens with a "left:" named argument.
HeaderItemBorderColor: "border_colors(@Colors.transparent, bottom: @FormControlBorderColor)"
HeaderItemBorderThickness: "border_thickness(0px, bottom: 1px)"
HeaderItemBorderRadius: "border_radius(0px)"

# ── Tab Bar ─────────────────────────────────────────────────────────────────
# TabPosition = North is canonical (default). Geometric tokens (BorderRadius,
# BorderThickness) are auto-rotated to South/East/West; theme authors only need
# to define North. Per-position colour overrides: TabBarTabSouthBackground etc.

# The stop at y1 is the edge the tab shares with its pane. Routing it through a token instead
# of a literal lets a pane whose background is not the default declare its own — see
# FreeCADStyle::setStyleOverride and PropertyView.
CurrentPaneBackground: "@TabWidgetBackground"
TabBarTabSelectedBackground: "linear_gradient(x1: 0, x2: 0, y1: 1, y2: 0, @CurrentPaneBackground, @Background.000)"

TabBarTabBorderRadius: "border_radius(0px, top: @BaseRadius.medium)"
TabBarTabHoveredBorderColor: "@BaseBorderColor"
TabBarTabBorderThickness: "border_thickness(1px, bottom: 0)"

# Spacing between adjacent tabs (gap semantics: positive = gap, negative = overlap).
# Default -1px produces 1px overlap so adjacent tab borders merge into one.
# Set to e.g. 4px for a spaced-apart appearance.
TabBarTabSpacing: -1px

TabBarTabPadding: "padding(vertical: @Spacing.150, horizontal: @Spacing.300)"
TabBarTabIconSpacing: "@Spacing.150"

TabBarTabSelectedBorderColor: "@BaseBorderColor"
TabBarTabDisabledBackground: "@BaseDisabledBackground"
TabBarTabDisabledTextColor: "@BaseDisabledTextColor"

WbTabBarBaseBackground: "reset()"
WbTabBarTabBorderRadius: "border_radius(0px)"
WbTabBarTabBorderThickness: "border_thickness(0px, left: 1px, right: 1px)"

# ── Transparent tab bar — free-standing pills over the 3D view ───────────────
TabBarTabTransparentSpacing: "@Spacing.150"

TabBarTabTransparentBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Background.050, @Background.100)"
TabBarTabTransparentBorderRadius: "@BaseRadius.medium"
TabBarTabTransparentBorderColor: "@BaseBorderColor"
TabBarTabTransparentBorderThickness: 1px
TabBarTabTransparentPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.100)"
TabBarTabTransparentHoveredBackgroundEffect: "effect(lighten: 0.05)"
TabBarTabTransparentSelectedBackground: "blend(@TabBarTabTransparentBackground, @Accent.500, 20%)"
TabBarTabTransparentSelectedBorderColor: "blend(@TabBarTabTransparentBorderColor, @Accent.500, 20%)"

# No base strip and no pane — the pills float over the view. Height and Overlap are 0px
# rather than reset(), because reset() would fall through to Fusion's own metrics and
# still reserve the space.
TabBarBaseTransparentBackground:  "reset()"
TabBarBaseTransparentBorderColor: "reset()"
TabBarBaseTransparentHeight:      0px
TabBarBaseTransparentOverlap:     0px

TabWidgetTransparentBackground:      "reset()"
TabWidgetTransparentBorderColor:     "reset()"
TabWidgetTransparentBorderThickness: 0px
TabWidgetTransparentPadding: "padding(bottom: @TabBarTabTransparentSpacing)"

# ── Transparent property editor — an opaque panel sized to its rows ──────────
# Unlike the tree, property rows are a dense label/value grid that needs a continuous
# surface behind them, so this paints a real panel rather than a box per item. Because it
# paints, it stops the transparency chain: the header, scrollbars and inline editors below
# it render as if docked. Items deliberately get no Transparent tokens — the variant then
# drops out of the fallback chain and they resolve their normal styling.
PropertyEditorTransparentBackground: "@Background.050"
PropertyEditorTransparentBorderColor: "@BaseBorderColor"
PropertyEditorTransparentBorderThickness: 1px
PropertyEditorTransparentBorderRadius: "@BaseRadius.medium"
PropertyEditorTransparentPadding: "0px"
PropertyEditorTransparentIsTransparent: "false"

# ── Tab Bar Base ─────────────────────────────────────────────────────────────
# TabBarBaseHeight:  visible strip height below the tabs (PM_TabBarBaseHeight - PM_TabBarBaseOverlap).
# TabBarBaseOverlap: how many px the strip extends under the tab row (PM_TabBarBaseOverlap).
# Qt sizes the PE_FrameTabBarBase rect to Height + Overlap, then hides the overlap portion
# under the tabs, leaving exactly TabBarBaseHeight px visible.
TabBarBaseHeight: 4px
TabBarBaseOverlap: 4px
TabBarBaseBorderColor: "@BaseBorderColor"
TabBarBaseBorderThickness: "border_thickness(0px, bottom: 1px)"
TabBarBaseBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, opacity(@BaseBorderColor, 0%), opacity(@BaseBorderColor, 40%))"

# ── Tab Widget Pane ──────────────────────────────────────────────────────────
TabWidgetBackground: "@Background.100"
TabWidgetBorderColor: "@BaseBorderColor"
TabWidgetBorderRadius: "border_radius(@BaseRadius.medium)"
TabWidgetBorderThickness: "border_thickness(1px)"
TabWidgetPadding: 0

# ── Tab Bar Close Button ──────────────────────────────────────────────────────
TabBarCloseButtonHeight: 14px
TabBarCloseButtonWidth: 14px
TabBarCloseButtonBorderRadius: "@BaseRadius.medium"
TabBarCloseButtonIconColor: "@BaseTextColor"
TabBarCloseButtonPadding: "padding(@Spacing.100)"

TabBarCloseButtonHoveredBackground: "@Red.600"
TabBarCloseButtonHoveredIconColor: "@Background.050"

TabBarCloseButtonPressedBackground: "@Red.800"
TabBarCloseButtonPressedIconColor: "@Background.050"

TabBarCloseButtonDisabledIconColor: "@BaseDisabledTextColor"

ExpressionButtonBackground: "@ButtonBackground"
ExpressionButtonBorderColor: "@ButtonBorderColor"

ExpressionButtonCheckedBackground: "linear_gradient(x1: 0, y1: 0, x2: 0, y2: 1, @Accent.700, @Accent.800)"
ExpressionButtonCheckedBorderColor: "@Accent.900"
ExpressionButtonCheckedIconColor: "@Background.050"
ExpressionButtonPadding: "0px"

# ── Menu Bar ─────────────────────────────────────────────────────────────────
# Root tokens control the bar background and outer layout.
# MenuBarPadding drives PM_MenuBarHMargin / PM_MenuBarVMargin (half-edge values each side).
# MenuBarBorderThickness draws a bottom separator between the bar and content area.
MenuBarBackground: "@BaseWindowBackground"
MenuBarBorderColor: "@BaseBorderColor"
MenuBarBorderThickness: "border_thickness(0px, bottom: 1px)"
MenuBarPadding: "padding(horizontal: @Spacing.300, vertical: @Spacing.000)"

# ── Menu Bar Items ────────────────────────────────────────────────────────────
# MenuBarItemSpacing drives PM_MenuBarItemSpacing (gap between adjacent items).
# MenuBarItemPadding controls the content area inside each item (drives CT_MenuBarItem size).
MenuBarItemSpacing: "@Spacing.000"
MenuBarItemPadding: "padding(horizontal: @Spacing.200, vertical: @Spacing.050)"
MenuBarItemMargin: "padding(@Spacing.100)"
MenuBarItemBorderRadius: "@BaseRadius.small"
MenuBarItemTextColor: "@BaseTextColor"

MenuBarItemHoveredBackground: "@Background.200"
MenuBarItemHoveredTextColor: "@BaseTextColor"

MenuBarItemPressedBackground: "@Neutral.400"
MenuBarItemPressedInnerShadow: "@ButtonPressedInnerShadow"
MenuBarItemPressedTextColor: "@BaseTextColor"

MenuBarItemDisabledTextColor: "@BaseDisabledTextColor"

# ── Menu ─────────────────────────────────────────────────────────────────────
# The popup is a top-level window, so it stays square: a painted radius would leave the
# window's own square corners showing through. Rounding it later needs only
# WA_TranslucentBackground in polish(), since PE_PanelMenu already owns the whole surface.
# MenuPadding is the pill inset — with MenuBorderThickness it drives PM_MenuHMargin and
# PM_MenuVMargin, which is the only way Qt lets a style inset menu items: QMenu::paintEvent
# clips every CE_MenuItem call to that item's own action rect.
MenuBackground: "@ListBackground"
MenuBorderColor: "@ListBorderColor"
MenuBorderThickness: "@ListBorderThickness"
MenuBorderRadius: 0px
MenuPadding: "padding(@Spacing.050)"
MenuIconSize: 16px
MenuOverlap: 0px

# ── Menu Item ────────────────────────────────────────────────────────────────
# MenuItemIconSpacing is every inter-column gap (leading column↔text, text↔arrow), matching
# how ListItemIconSpacing is used by itemViewLayout(). There is no indicator↔icon gap: the
# two share one column, as the note below spells out.
# MenuItemSpacing is the gap between consecutive items; MenuItemMargin insets the highlight
# box beyond what MenuPadding already does. The two are independent knobs.
# There are deliberately no MenuIndicator* tokens: contextOf() routes the Indicator element
# to the CheckBox component, and drawPrimitive() points the exclusive glyph at RadioButton,
# so the check column resolves against CheckBox*/RadioButton*.
# The icon and the check indicator share one leading column, sized to the wider of MenuIconSize
# and CheckBoxWidth: a checkable item shows its indicator, any other item shows its icon.
MenuItemPadding: "padding(horizontal: @Spacing.150, vertical: @Spacing.100, right: @Spacing.300)"
MenuItemIconSpacing: "@ListItemIconSpacing"
MenuItemSpacing: "@Spacing.050"
MenuItemMargin: "padding(0px)"
MenuItemBorderRadius: 2px
MenuItemTextColor: "@BaseTextColor"
MenuItemHoveredBackground: "@ListRowPressedBackground"
MenuItemPressedBackground: "@ListRowSelectedBackground"
MenuItemDisabledTextColor: "@ListDisabledTextColor"
MenuItemMinWidth: 240px
# No MenuItemCheckedBackground on purpose: a checkable item always shows its indicator, so a
# row tint would only repeat what the indicator already says — and a menu like the toolbar
# visibility one has half a dozen checked rows at once, which reads as noise. The token does
# resolve (contextOf() maps QStyleOptionMenuItem::checked to StyleState::Checked), so a theme
# that wants the tint can state it.

# ── Menu Shortcut ────────────────────────────────────────────────────────────
# Only the gap is ours: Qt measures the accelerator column itself and adds its width to
# every row after sizing them, reported back as QStyleOptionMenuItem::reservedShortcutWidth.
MenuShortcutSpacing: "@Spacing.400"
MenuShortcutTextColor: "@BaseDisabledTextColor"

# ── Menu Separator / Section ─────────────────────────────────────────────────
# One element covers both a plain rule and an addSection() header; the header additionally
# uses MenuSeparatorPadding, MenuSeparatorTextColor and MenuSeparatorIconSpacing (the gap
# between the section label and the rule that fills the rest of the row). Set
# MenuSeparatorBorderThickness to reset() to drop the rule entirely.
MenuSeparatorHeight: "@Spacing.200"
MenuSeparatorMargin: "padding(horizontal: @Spacing.100)"
MenuSeparatorBorderColor: "@SeparatorColor"
MenuSeparatorBorderThickness: "@SeparatorThickness"
MenuSeparatorPadding: "padding(horizontal: @Spacing.100, vertical: @Spacing.050)"
MenuSeparatorTextColor: "@BaseDisabledTextColor"
MenuSeparatorIconSpacing: "@Spacing.100"

# ── Submenu Arrow ────────────────────────────────────────────────────────────
# Left uncoloured on purpose: with no MenuArrowIconColor the arrow follows the item label
# through every state. MenuArrowIconColor remains available for a theme that wants an arrow
# colour distinct from the label, but stating it opts out of that state tracking — elements
# do not chain, so an Arrow token never sees the item's Hovered/Disabled state.
MenuArrowWidth: 8px

ReportOutputBackground: "reset()"
ReportOutputBorderColor: "reset()"

# ── Highlight Overlay ────────────────────────────────────────────────────────
# The halo Gui::HighlightOverlay paints around a marked control. The background is a tint
# rather than a fill so the control's own text and indicator stay legible beneath it, and
# HighlightOverlayMargin is both how far the halo stands off the control and how far it is
# allowed to reach past the edge of the widget hosting it.
HighlightOverlayBackground: "opacity(@Accent.500, 12%)"
HighlightOverlayBorderColor: "@Accent.500"
HighlightOverlayBorderThickness: 2px
HighlightOverlayBorderRadius: "@BaseRadius.medium"
HighlightOverlayMargin: "@Spacing.100"
